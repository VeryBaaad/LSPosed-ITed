name: Core

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
  merge_group:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_BASEDIR: "${{ github.workspace }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/main' ) || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          fi
          if [ ! -z "${{ secrets.PRIVATE_KEY }}" ]; then
            echo '${{ secrets.PUBLIC_KEY }}' | base64 --decode > magisk-loader/public_key
            echo '${{ secrets.PRIVATE_KEY }}' | base64 --decode > magisk-loader/private_key
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
            max-size: 2G
            key: ${{ runner.os }}
            restore-keys: ${{ runner.os }}
            save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Remove Android's cmake
        shell: bash
        run: rm -rf $ANDROID_HOME/cmake

      - name: Configure Gradle properties
        run: |
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Build with Gradle
        run: |
          ./gradlew zipAll

      - name: Prepare artifact
        if: success()
        id: prepareArtifact
        run: |
          zygiskReleaseName=`ls magisk-loader/release/LSPosed-v*-release.zip | awk -F '(/|.zip)' '{print $3}'` && echo "zygiskReleaseName=$zygiskReleaseName" >> $GITHUB_OUTPUT
          zygiskReleaseLogName=`ls magisk-loader/release/LSPosed-v*-release-log.zip | awk -F '(/|.zip)' '{print $3}'` && echo "zygiskReleaseLogName=$zygiskReleaseLogName" >> $GITHUB_OUTPUT
          unzip magisk-loader/release/LSPosed-v*-release.zip -d LSPosed-release
          unzip magisk-loader/release/LSPosed-v*-release-log.zip -d LSPosed-release-log

      - name: Post to channel
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            OUTPUT="magisk-loader/release/"
            export zygiskRelease=$(find $OUTPUT -name "LSPosed-v*-release.zip")
            export zygiskReleaseLog=$(find $OUTPUT -name "LSPosed-v*-release-log.zip")
            ESCAPED=`python3 -c 'import json,os,urllib.parse; msg = json.dumps(os.environ["COMMIT_MESSAGE"]); print(urllib.parse.quote(msg if len(msg) <= 1024 else json.dumps(os.environ["COMMIT_URL"])))'`
            curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHAT_ID}&media=%5B%7B%22type%22%3A%22document%22%2C%20%22media%22%3A%22attach%3A%2F%2FzygiskRelease%22%7D%2C%7B%22type%22%3A%22document%22%2C%20%22media%22%3A%22attach%3A%2F%2FzygiskReleaseLog%22%2C%22caption%22:${ESCAPED}%7D%5D" -F zygiskRelease="@$zygiskRelease" -F zygiskReleaseLog="@$zygiskReleaseLog"
          fi

      - name: Upload to repository
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          git clone https://github.com/${{ secrets.GH_REPO }} itedist
          cd itedist
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -f ./LSPosed-v*-release.zip
          rm -f ./LSPosed-v*-release-log.zip
          cp ../magisk-loader/release/LSPosed-v*-release.zip .
          cp ../magisk-loader/release/LSPosed-v*-release-log.zip .
          rm -rf .git
          git init
          git branch -m main
          git remote add origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ secrets.GH_REPO }}
          git add .
          git commit -m "Initial commit"
          git push origin main --force

      - name: Notice to telegram
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          V=$(echo "${{ steps.prepareArtifact.outputs.zygiskReleaseName }}" | cut -d'-' -f4)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.ITED_CHAT_ID }}" \
            --data-urlencode "message_thread_id=${{ secrets.ITED_TOPIC_ID }}" \
            --data-urlencode "parse_mode=MarkdownV2" \
            --data-urlencode "text=$(printf 'New version pushed: `%s`\n新版本已推送: `%s`' "$V" "$V")" \
            --data-urlencode "reply_markup={\"inline_keyboard\":[[{\"text\":\"Download / 下载\", \"url\":\"https://t.me/lspitedbot?start=dl\"}]]}"

      - name: Upload zygisk release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskReleaseName }}
          path: "./LSPosed-release/*"

      - name: Upload zygisk release with log
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskReleaseLogName }}
          path: "./LSPosed-release-log/*"

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: mappings
          path: |
            magisk-loader/build/outputs/mapping
            app/build/outputs/mapping

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols
          path: build/symbols
